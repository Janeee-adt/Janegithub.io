    <script>
        var mode = "light";
        function changeMode() {
            var body = document.getElementById("body");
            var cards = document.querySelectorAll(".card");
            var icon = document.getElementById("colorIcon");
            var footerCard = document.getElementById("footerCard");

            mode = mode == "light" ? "dark" : "light";
            body.setAttribute("data-bs-theme", mode);

            if (mode == "light") {
                icon.src = "./img/moon.png";
                icon.alt = "Dark Mode";
                body.style.backgroundColor = "#f0f0f0";
                body.style.color = "#222";
                cards.forEach(card => {
                    card.style.backgroundColor = "#f8f9fa";
                    card.style.color = "#222";
                    card.style.borderColor = "#ccc";
                });
                if (footerCard) {
                    footerCard.style.backgroundColor = "#f8f9fa";
                    footerCard.style.color = "#222";
                    footerCard.querySelector(".card-body").style.backgroundColor = "#f8f9fa";
                }
            } else {
                icon.src = "./img/sun.png";
                icon.alt = "Light Mode";
                body.style.backgroundColor = "#222";
                body.style.color = "white";
                cards.forEach(card => {
                    card.style.backgroundColor = "#2e2e2e";
                    card.style.color = "white";
                    card.style.borderColor = "#444";
                });
                if (footerCard) {
                    footerCard.style.backgroundColor = "#2e2e2e";
                    footerCard.style.color = "white";
                    footerCard.querySelector(".card-body").style.backgroundColor = "#2e2e2e";
                }
            }
        }

    </script>
