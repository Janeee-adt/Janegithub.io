<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jane's World</title>
  <link rel="icon" href="./img/iconindex.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    .glass {
      backdrop-filter: blur(8px) brightness(100%);
      background-color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 4px 4px 10px 4px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body id="body" style="font-family: 'Press Start 2P', cursive; padding-top: 100px;">
  <nav class="navbar navbar-expand-md fixed-top shadow" style="background-color: #006912;">
    <div class="container-fluid mt-2 px-5 py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center" style="height: 60px; overflow: hidden;">
        <div class="h4" style="display: inline-block; margin-right: 10px; color: #ffffff; font-weight: bold;">MY WORLD
        </div>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav d-flex align-items-md-center" style="font-family: 'Press Start 2P', cursive;">
          <li class="nav-item">
            <a href="" class="nav-link fw-bold text-uppercase mt-2 mx-2 px-md-3 px-2 py-md-2 py-1"
              style="color: #FFFFFF;">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a href="activities.html" class="nav-link fw-bold text-uppercase mt-2 mx-2 px-md-3 px-2 py-md-2 py-1"
              style="color: #FFFFFF;">
              Activities
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <section id="home" class="d-flex justify-content-center align-items-center"
    style="min-height: 100vh; position: relative; font-family: 'Press Start 2P', cursive; overflow: hidden; padding: 0; margin: 0;">
    <img src="./img/indexbg.webp" alt="Minecraft Cube"
      style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; object-fit: cover; image-rendering: pixelated; z-index: -1;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow glass p-4 text-center" style="border-radius: 20px;">
            <img src="./img/mypic.png" alt="Your Photo"
              style="width: 180px; height: 180px; border-radius: 50%; image-rendering: pixelated; object-fit: cover; margin: 0 auto 20px auto; box-shadow: 5px 5px 10px rgba(0,0,0,0.2);">
            <div
              style="color: white; padding: 20px 25px; font-size: 12px; font-family: 'Press Start 2P', cursive; line-height: 1.6; text-align: center; border-radius: 12px; box-shadow: 5px 5px 10px rgba(0,0,0,0.2);">
              Jane Angelou D. Tolentino<br>Student
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous">
    </script>

</html>
